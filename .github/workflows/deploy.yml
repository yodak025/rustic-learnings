# =============================================================================
# deploy.yml — build en CI, imagen a GHCR, deploy por SSH (ver docs/cicd.md)
# =============================================================================
# El servidor nunca construye: recibe la referencia del artefacto (SHA del
# commit) y descarga la imagen ya hecha. El login al registro usa el token
# efímero del run; no persiste ninguna credencial en el servidor.
# =============================================================================

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync compose file
        run: |
          scp deploy/docker-compose.yaml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/rustic-learnings/docker-compose.yaml

      - name: Deploy
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<'SCRIPT'
          set -euo pipefail
          cd /opt/rustic-learnings
          echo "IMAGE_TAG=${{ github.sha }}" > .env
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull --quiet
          docker compose up -d
          docker logout ghcr.io
          # Conserva solo la imagen desplegada y 'latest'; el rollback
          # re-descarga del registro (docs/cicd.md).
          docker images "ghcr.io/${{ github.repository }}" --format '{{.Repository}}:{{.Tag}}' \
            | grep -v -e ':${{ github.sha }}$' -e ':latest$' \
            | xargs -r docker rmi > /dev/null || true
          docker compose ps
          SCRIPT
